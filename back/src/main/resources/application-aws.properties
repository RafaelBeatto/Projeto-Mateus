# =====================================================================
# Central da Secretaria — AWS (EC2 / Elastic Beanstalk / ECS / App Runner)
# Ativado com SPRING_PROFILES_ACTIVE=aws; só sobrescreve o application.properties.
# Tudo que muda de um ambiente para outro vem de variável de ambiente
# (Parameter Store / Secrets Manager / variáveis da tarefa). O jar não leva segredo:
# sem APAE_DB_URL, APAE_DB_SENHA, APAE_JWT_SEGREDO ou APAE_CORS_ORIGENS o back nem sobe.
# Modelo das variáveis: deploy/aws/apae-aws.env.exemplo
# =====================================================================

# Atrás do Load Balancer (ALB): escuta em todas as interfaces; quem expõe para a internet é o ALB,
# e o security group da instância/tarefa só aceita tráfego vindo dele.
server.address=0.0.0.0
server.port=${PORT:8080}
# O ALB termina o HTTPS e repassa X-Forwarded-For/Proto: o Tomcat usa para saber o IP real e se é HTTPS
# (só confia nesses cabeçalhos vindos de IP privado da VPC — padrão do Tomcat).
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Banco no RDS (PostgreSQL), sempre com TLS. Ex.: jdbc:postgresql://apae.xxxx.sa-east-1.rds.amazonaws.com:5432/apae?sslmode=require
spring.datasource.url=${APAE_DB_URL}
spring.datasource.username=${APAE_DB_USUARIO:apae}
spring.datasource.password=${APAE_DB_SENHA}
spring.datasource.hikari.maximum-pool-size=${APAE_DB_POOL:10}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
server.tomcat.threads.max=${APAE_THREADS:100}

aplicacao.jwt.segredo=${APAE_JWT_SEGREDO}

# Origens do front (CloudFront/Amplify/domínio próprio), separadas por vírgula. Só HTTPS.
aplicacao.cors.origens-permitidas=${APAE_CORS_ORIGENS}

# AWS S3: na AWS use o papel IAM da instância/tarefa (deixe as chaves vazias).
aplicacao.armazenamento.bucket=${APAE_S3_BUCKET:apae-chorobura}
aplicacao.armazenamento.regiao=${APAE_S3_REGIAO:sa-east-1}
aplicacao.armazenamento.endpoint=
aplicacao.armazenamento.chave-acesso=${AWS_ACCESS_KEY_ID:}
aplicacao.armazenamento.chave-secreta=${AWS_SECRET_ACCESS_KEY:}
# Na AWS sempre S3 (a rota pública /api/arquivos-locais fica desligada).
aplicacao.armazenamento.pasta-local=

# Health check do ALB/ECS: GET /actuator/health (só o status, sem detalhes).
management.endpoint.health.probes.enabled=true

# Logs em texto simples no stdout (CloudWatch Logs recolhe)
logging.level.root=INFO
